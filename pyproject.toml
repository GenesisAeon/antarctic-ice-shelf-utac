[project]
name = "antarctic-ice-shelf-utac"
version = "1.0.0"
description = "Real Antarctic ice shelf mass budget (Davison et al. 2023), Holocene meltwater-feedback mechanism (Nature Geoscience 2025), and CMIP6 regional East/West asymmetry (Muilwijk et al. 2026), no UTAC/CREP/AFET bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/antarctic-ice-shelf-utac"
Repository = "https://github.com/GenesisAeon/antarctic-ice-shelf-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antarctic_ice_shelf_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=antarctic_ice_shelf_utac --cov-report=term-missing -v"
